<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Query Editor</title>
  <link rel="stylesheet" href="queryEditor.css">
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="scripts/css/codemirror.min.css">
  <link rel="stylesheet" href="scripts/css/material-darker.min.css">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'">
</head>

<body>
  <div id="file-title" title="query file path"></div>

  <!-- Täze navbar goşuldy -->
  <div id="navbar">

  <div id="editor-container">
    <textarea id="code-area"></textarea>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Confirmation Dialog goşuldy -->
  <div id="confirmation-overlay">

      <h3>⚠️ Üýtgeşmeleri pozular</h3>
      <p>Uytgeshmeler pozular we defoult query goýular.<br>Şony etmek isleýärsiňizmi?</p>
      <div id="confirmation-buttons">
        <button id="confirm-yes">Yes</button>
        <button id="confirm-no">No</button>
      </div>
    </div>
  </div>

  <!-- CodeMirror Scripts -->
  <script src="scripts/codemirror.min.js"></script>
  <script src="scripts/sql.min.js"></script>
  <script src="editorRenderer.js" defer></script>
</body>

</html>
