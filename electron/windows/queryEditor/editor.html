<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Query Editor</title>
  <link rel="stylesheet" href="queryEditor.css">
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/theme/material-darker.min.css">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;">
</head>
<body>
  <h2 id="file-title"></h2>
  
  <!-- Täze navbar goşuldy -->
  <div id="navbar">
    <button id="save-btn">💾 Save</button>
    <button id="restore-btn">🔄 Restore Default Query</button>
  </div>

  <div id="editor-container">
    <textarea id="code-area"></textarea>
  </div>

  <!-- Confirmation Dialog goşuldy -->
  <div id="confirmation-overlay">
    <div id="confirmation-dialog">
      <h3>⚠️ Üýtgeşmeleri pozular</h3>
      <p>Uytgeshmeler pozular we defoult query goýular.<br>Şony etmek isleýärsiňizmi?</p>
      <div id="confirmation-buttons">
        <button id="confirm-yes">Yes</button>
        <button id="confirm-no">No</button>
      </div>
    </div>
  </div>

  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/mode/sql/sql.min.js"></script>
  <script src="editorRenderer.js" defer></script>
</body>
</html>
